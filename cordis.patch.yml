# Healer for DeepSeek Harness: adds the Healer MCP server through the official MCP client.
# The server is the same one the Claude Code plugin uses, pinned to an exact npm version.
# The key comes from HEALER_API_KEY or, if unset, from ~/.healer/config.json (written by `npx @meiti/healer`).
# DSH drops variables whose name contains KEY from the server's environment, so it is passed explicitly.
- insert:
  - id: mcp-healer
    name: '@deepseek-ai/dsh-mcp-client'
    config:
      serverName: healer
      transport: stdio
      command: npx
      args: ['-y', '-p', '@meiti/healer@0.2.0', 'healer-mcp']
      env:
        HEALER_API_KEY: !!js process.env.HEALER_API_KEY || ''
      startupTimeoutMs: 120000
      toolCallTimeoutMs: 120000
